<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Acopiara Transparente">
  <defs>
    <clipPath id="lens"><circle cx="54" cy="54" r="38"/></clipPath>
  </defs>
  <!-- lente: a bandeira de Acopiara (verde | branco | azul) vista por uma lupa -->
  <g clip-path="url(#lens)">
    <rect x="0" y="0" width="42" height="120" fill="#0E5A3A"/>
    <rect x="42" y="0" width="25" height="120" fill="#FFFFFF"/>
    <rect x="67" y="0" width="53" height="120" fill="#123B6E"/>
    <!-- sertão no centro: sol e mandacaru -->
    <circle cx="54" cy="40" r="8" fill="#C9A227"/>
    <path d="M51 82 V56 q0-5 3-5 q3 0 3 5 V82z M45 70 v-8 q0-3 2.5-3 q2.5 0 2.5 3 v4 h1 v4z M63 66 v-8 q0-3-2.5-3 q-2.5 0-2.5 3 v4 h-1 v4z" fill="#0E5A3A"/>
    <rect x="16" y="82" width="80" height="20" fill="#E9DFC4"/>
    <!-- reflexo -->
    <path d="M26 30 q14-16 34-16" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  </g>
  <circle cx="54" cy="54" r="38" fill="none" stroke="#17211C" stroke-width="7"/>
  <!-- cabo -->
  <path d="M82 82 L108 108" stroke="#17211C" stroke-width="13" stroke-linecap="round"/>
  <path d="M84 84 L106 106" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
</svg>
